# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://cibuildwheel.readthedocs.io/en/stable/deliver-to-pypi/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read


jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-11]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3

      - uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 requires a unique name per matrix entry.
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Pull every artifact from build_wheels (one per matrix os) and
          # build_sdist, flattening them into dist/ for the publisher.
          path: dist
          pattern: "*"
          merge-multiple: true

      # Pinned to an exact tag (rather than the moving release/v1) to lock
      # down the action used for the actual PyPI upload via Trusted
      # Publishing.
      - uses: pypa/gh-action-pypi-publish@v1.10.3
